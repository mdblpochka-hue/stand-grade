services:
  - type: web
    name: stand-grade
    runtime: node
    # Бесплатный тариф: файловая система эфемерная,
    # поэтому store.json сбрасывается при рестарте/деплое.
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: OWNER_PASSWORD
        sync: false
      - key: OWNER_START_BALANCE
        value: "500000"
      # Подключите бесплатный Neon/Supabase Postgres, чтобы балансы,
      # инвентарь и промокоды сохранялись между деплоями.
      - key: DATABASE_URL
        sync: false
