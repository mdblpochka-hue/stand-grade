services:
  - type: web
    name: stand-grade
    runtime: node
    # Бесплатный тариф: файловая система эфемерная,
    # поэтому store.json сбрасывается при рестарте/деплое.
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: PLAYER_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_START_BALANCE
        value: "100000"
      - key: OWNER_PASSWORD
        sync: false
      - key: OWNER_START_BALANCE
        value: "500000"
